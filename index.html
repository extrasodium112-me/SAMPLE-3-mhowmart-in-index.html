<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mhow Mart - Apni Dukaan</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Poppins',sans-serif; box-sizing:border-box}
body{margin:0; background:#f8f9ff;}
.header{position:sticky; top:0; z-index:100; background:white; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 15px rgba(0,0,0,0.08);}
.logo{font-weight:700; font-size:20px; color:#6a11cb;}
.cart-icon{background:#6a11cb; color:white; padding:8px 15px; border-radius:25px; cursor:pointer; font-weight:600;}
.offer{background:linear-gradient(90deg,#ff9a00,#ff6a00); color:white; text-align:center; padding:8px; font-size:13px; font-weight:600;}
.cats{display:flex; gap:12px; padding:15px; overflow:auto;}
.cat{background:white; border:2px solid #eee; padding:12px 18px; border-radius:30px; white-space:nowrap; cursor:pointer; font-weight:600;}
.cat.active{background:#6a11cb; color:white; border-color:#6a11cb;}
.products{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px;}
.prod{background:white; border-radius:18px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.06); padding:10px;}
.prod img{width:100%; height:110px; object-fit:cover; border-radius:12px;}
.prod h4{font-size:13px; margin:8px 0 4px; height:32px; overflow:hidden;}
.qty-box{display:flex; align-items:center; justify-content:space-between; background:#f3f0ff; border-radius:10px; padding:5px; margin:8px 0;}
.qty-box button{border:none; background:white; width:28px; height:28px; border-radius:50%; font-weight:bold; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.1);}
.add-btn{width:100%; background:#6a11cb; color:white; border:none; padding:10px; border-radius:12px; font-weight:600; cursor:pointer;}
.price{color:#6a11cb; font-weight:700;}.old{font-size:11px; color:gray; text-decoration:line-through;}
#cartDrawer{position:fixed; bottom:0; left:0; width:100%; background:white; border-radius:25px 25px 0 0; box-shadow:0 -5px 30px rgba(0,0,0,0.2); transform:translateY(100%); transition:0.3s; z-index:200; max-height:85vh; overflow:auto; padding:20px;}
#cartDrawer.open{transform:translateY(0);}
.cart-item{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #eee;}
.checkout{width:100%; background:#25D366; color:white; border:none; padding:14px; border-radius:15px; font-size:16px; font-weight:700; margin-top:15px;}
#pincodeGate{position:fixed; inset:0; background:rgba(0,0,0,0.92); display:flex; align-items:center; justify-content:center; z-index:9999;}
.pin-card{background:white; padding:25px; border-radius:20px; width:310px; text-align:center;}
</style>
</head>
<body>

<div id="pincodeGate"><div class="pin-card"><h2>📍 Mhow Mart</h2><p>Only for <b>Mhow - 453441</b></p><input id="pinIn" placeholder="Pincode 453441" style="width:90%; padding:12px; border:2px solid #6a11cb; border-radius:10px; margin:10px 0;"><br><button onclick="checkPin()" style="width:95%; padding:12px; background:#6a11cb; color:white; border:none; border-radius:10px; font-weight:600;">Enter Store</button><p id="pinErr" style="color:red; display:none; font-size:13px;">Sirf 453441 allowed hai</p></div></div>

<div class="header"><div class="logo">Mhow Mart 🛒</div><div class="cart-icon" onclick="toggleCart()">🛒 <span id="cartCount">0</span></div></div>
<div class="offer">🎉 Rs.100 wala item sirf Rs.79 me! + Delivery Rs.5</div>

<div class="cats">
  <div class="cat active" onclick="filterCat('plastic',this)">🪣 Plastic Items</div>
  <div class="cat" onclick="filterCat('kirana',this)">🌾 Kirana</div>
</div>

<div class="products" id="productList"></div>

<div id="cartDrawer">
  <div style="display:flex; justify-content:space-between;"><h3 style="margin:0;">Your Cart</h3><span onclick="toggleCart()" style="cursor:pointer;">❌</span></div>
  <div id="cartItems" style="margin-top:10px;"><p style="color:gray; text-align:center;">Cart khali hai</p></div>
  <div id="cartTotal" style="font-weight:700; margin-top:10px;"></div>
  <button class="checkout" onclick="orderWhatsApp()">WhatsApp pe Order Karo</button>
</div>

<script>
let cart = [];
const prods = {
 plastic:[{id:1,name:"Plastic Tub 20L",price:100,offer:79,img:"https://images.unsplash.com/photo-1584305574647-0cc949a2bb9f"},{id:2,name:"Plastic Mug Strong",price:50,offer:35,img:"https://images.unsplash.com/photo-1607613009820-a29f7bb81c04"}],
 kirana:[{id:3,name:"Toor Dal 1KG Premium",price:120,offer:79,img:"https://images.unsplash.com/photo-1586201375761-83865001e31c"},{id:4,name:"Besan 1KG",price:90,offer:79,img:"https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b"}]
};
function checkPin(){ if(document.getElementById('pinIn').value==='453441'){document.getElementById('pincodeGate').style.display='none';}else{document.getElementById('pinErr').style.display='block';} }
function render(cat){
 let list=prods[cat]; let h='';
 list.forEach(p=>{
   let q = (cart.find(c=>c.id===p.id)?.qty)||0;
   h+=`<div class="prod"><img src="${p.img}"><h4>${p.name}</h4><div><span class="old">Rs ${p.price}</span> <span class="price">Rs ${p.offer}</span></div>
   <div class="qty-box"><button onclick="changeQty(${p.id},-1)">-</button><span id="q-${p.id}">${q}</span><button onclick="changeQty(${p.id},1)">+</button></div>
   <button class="add-btn" onclick="addToCart(${p.id},'${cat}')">Add to Cart</button></div>`;
 });
 document.getElementById('productList').innerHTML=h;
}
function changeQty(id,delta){let item=cart.find(c=>c.id===id);let prod=[...prods.plastic,...prods.kirana].find(p=>p.id===id);if(!item&&delta>0){cart.push({id:prod.id,name:prod.name,offer:prod.offer,qty:1});}else if(item){item.qty+=delta; if(item.qty<=0) cart=cart.filter(c=>c.id!==id);} document.getElementById(`q-${id}`).innerText=cart.find(c=>c.id===id)?.qty||0; updateCart();}
function addToCart(id,cat){let prod=[...prods.plastic,...prods.kirana].find(p=>p.id===id);let item=cart.find(c=>c.id===id);if(!item) cart.push({id:prod.id,name:prod.name,offer:prod.offer,qty:1});else item.qty++; render(cat); updateCart(); toggleCart(true);}
function updateCart(){document.getElementById('cartCount').innerText=cart.reduce((s,c)=>s+c.qty,0); if(cart.length===0){document.getElementById('cartItems').innerHTML='<p style="color:gray; text-align:center;">Cart khali hai</p>'; document.getElementById('cartTotal').innerText=''; return;} let html=''; let total=0; cart.forEach(c=>{let t=c.offer*c.qty+5; total+=t; html+=`<div class="cart-item"><div>${c.name} x ${c.qty}</div><div>Rs ${t} <span style="color:gray; font-size:11px;">(inc 5 delivery)</span></div></div>`;}); document.getElementById('cartItems').innerHTML=html; document.getElementById('cartTotal').innerText='Total Payable: Rs '+total;}
function toggleCart(forceOpen){let d=document.getElementById('cartDrawer'); if(forceOpen===true) d.classList.add('open'); else d.classList.toggle('open');}
function filterCat(cat,el){document.querySelectorAll('.cat').forEach(c=>c.classList.remove('active')); el.classList.add('active'); render(cat);}
function orderWhatsApp(){if(cart.length===0){alert('Cart khali hai!');return;} let num="919876543210"; let msg="*Mhow Mart Order*%0A"; cart.forEach(c=>{msg+=`${c.name} x ${c.qty} = Rs ${c.offer*c.qty+5}%0A`;}); let total=cart.reduce((s,c)=>s+c.offer*c.qty+5,0); msg+=`%0A*Total: Rs ${total}*%0APincode: 453441%0ACOD`; window.open(`https://wa.me/${num}?text=${msg}`,'_blank');}
render('plastic');
</script>
</body>
</html>
